name: ProcureMate Android — build and publish APK
on:
  push:
    branches: [main]
    paths:
      - 'apps/procuremate-android/**'
      - '.github/workflows/procuremate-android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35 SDK
        run: |
          set -eu
          SDKMGR="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMGR"
          "$SDKMGR" --sdk_root="${ANDROID_HOME}" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify table parser
        run: |
          set -eu
          mkdir -p /tmp/procuremate-test
          javac -d /tmp/procuremate-test \
            apps/procuremate-android/app/src/main/java/pk/procuremate/app/GeometryBoqParser.java \
            apps/procuremate-android/app/src/test/java/pk/procuremate/app/GeometryBoqParserTest.java
          java -cp /tmp/procuremate-test pk.procuremate.app.GeometryBoqParserTest
      - name: Build APK
        working-directory: apps/procuremate-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify package and version
        run: |
          set -eu
          APK="apps/procuremate-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='pk.procuremate.app'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='0.1.1-beta'"
          sha256sum "$APK"
      - name: Retain APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcureMate-Pakistan-v0.1.1-Bilal-APK
          path: apps/procuremate-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
      - name: Publish downloadable GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          APK="apps/procuremate-android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="ProcureMate-Pakistan-v0.1.1-Bilal.apk"
          cp "$APK" "$OUT"
          if gh release view "v0.1.1-beta" >/dev/null 2>&1; then
            gh release upload "v0.1.1-beta" "$OUT" --clobber
          else
            gh release create "v0.1.1-beta" "$OUT" \
              --title "ProcureMate Pakistan v0.1.1-beta — Made by Bilal" \
              --notes "Beta for Android testing: improved screenshot/PDF BOQ table extraction, page/row references, quantity review flags, Made by Bilal branding. Debug-signed; export previous local records before reinstall if signature mismatch." \
              --prerelease
          fi
